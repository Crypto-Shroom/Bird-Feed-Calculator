# Dependabot watches only the active V3 application and its Firebase Functions package.
# V0–V2 and archive/ are preserved historical snapshots that are never installed,
# built or deployed, so they are deliberately not listed here (see AGENTS.md and #210).
version: 2
updates:
  - package-ecosystem: npm
    directory: /v3-webapp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      v3-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /v3-webapp/functions
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
    groups:
      functions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
