# Governance contract: this workflow validates code only. It does not publish, deploy, alter data, or modify formulations.
name: Validate calculator changes

on:
  pull_request:
  push:
    branches:
      - audit-safety-optimization-2026-08-14
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type-check, calculator test, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: v3-webapp/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm --dir v3-webapp install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm --dir v3-webapp check

      - name: Verify all calculator scenarios
        run: pnpm --dir v3-webapp test:calculator

      - name: Verify care guidance
        run: pnpm --dir v3-webapp test:care-guidance

      - name: Run unit tests
        run: pnpm --dir v3-webapp exec vitest run

      - name: Validate provenance ledger
        run: pnpm test:provenance

      - name: Build production bundle
        run: pnpm --dir v3-webapp build
