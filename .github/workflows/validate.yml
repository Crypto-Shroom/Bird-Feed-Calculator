# Governance contract: this workflow validates code only. It does not publish, deploy, alter data, or modify formulations.
name: Validate calculator changes

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Type-check, calculator test, and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm check

      - name: Verify all calculator scenarios
        run: pnpm test:calculator

      - name: Build production bundle
        run: pnpm build
