name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10.4.1
          run_install: false

      - name: Validate Firebase deployment credential format
        run: pnpm --dir v3-webapp verify:firebase-deploy-credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}"

      - name: Install V3 application dependencies
        run: pnpm --dir v3-webapp install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm --dir v3-webapp check
          pnpm --dir v3-webapp test:calculator
          pnpm --dir v3-webapp test:herb-safety
          pnpm --dir v3-webapp build

      - name: Build Firebase Functions
        run: |
          cd v3-webapp/functions
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@7c850a480ce753f4f06f010801fc5a43787740bb # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}"
          channelId: live
          projectId: bird-food-calculator-25e6d
          entryPoint: v3-webapp
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
