name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1
          run_install: false

      - name: Validate Firebase deployment credential format
        run: pnpm --dir v3-webapp verify:firebase-deploy-credential
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}"

      - name: Install V3 application dependencies
        run: pnpm --dir v3-webapp install --frozen-lockfile

      - name: Run verification checks
        run: |
          pnpm --dir v3-webapp check
          pnpm --dir v3-webapp test:calculator
          pnpm --dir v3-webapp test:herb-safety
          pnpm --dir v3-webapp build

      - name: Build Firebase Functions
        run: |
          cd v3-webapp/functions
          npm ci
          npm run build

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}"
          channelId: live
          projectId: bird-food-calculator-25e6d
          entryPoint: v3-webapp
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
