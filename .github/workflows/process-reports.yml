name: Process Firestore Report Queue

on:
  schedule:
    - cron: '0 8 * * *' # Once daily at 08:00 UTC
  workflow_dispatch:

jobs:
  process-reports:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd v3-webapp
          npm install --legacy-peer-deps firebase-admin axios

      - name: Run Report Processor
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node v3-webapp/scripts/process-reports.mjs
