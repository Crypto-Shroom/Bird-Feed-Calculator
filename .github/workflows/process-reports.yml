name: Process Firestore Report Queue

on:
  schedule:
    - cron: '0 8 * * *' # Once daily at 08:00 UTC
  workflow_dispatch:

jobs:
  process-reports:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          cd v3-webapp/functions
          npm ci --ignore-scripts

      - name: Install Processor Dependencies
        run: |
          corepack enable
          pnpm --dir v3-webapp install --frozen-lockfile --ignore-scripts

      - name: Run Report Processor
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIRD_FOOD_CALCULATOR_25E6D }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          pnpm --dir v3-webapp exec node scripts/process-reports.mjs
